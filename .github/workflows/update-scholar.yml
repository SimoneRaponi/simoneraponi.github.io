name: Update Scholar Stats

on:
  schedule:
    - cron: '0 7 * * *'   # Every day at 07:00 UTC
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-scholar.yml'   # Run once on first deploy
  workflow_dispatch:        # Allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Scholar stats
        shell: python3 {0}
        run: |
          import json, re, sys, time, urllib.request
          from datetime import date

          URL = 'https://scholar.google.com/citations?user=IgaW2DoAAAAJ&hl=en'
          HEADERS = {
              'User-Agent': ('Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                              'AppleWebKit/537.36 (KHTML, like Gecko) '
                              'Chrome/120.0 Safari/537.36'),
          }

          with open('data/scholar.json') as fh:
              previous = json.load(fh)

          html = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(URL, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      if r.status != 200:
                          raise RuntimeError(f'HTTP {r.status}')
                      html = r.read().decode('utf-8', errors='replace')
                  break
              except Exception as exc:
                  print(f'Attempt {attempt + 1} failed: {exc}', file=sys.stderr)
                  if attempt < 2:
                      time.sleep(15)

          if html is None:
              print('All attempts failed to fetch the Scholar page', file=sys.stderr)
              sys.exit(1)

          # Order on the profile page: citations(all), citations(since-2021),
          # hindex(all), hindex(since-2021), i10(all), i10(since-2021)
          stats = re.findall(r'gsc_rsb_std">([\d,]+)<', html)
          if len(stats) < 3:
              print(f'Could not parse citation stats, found: {stats}', file=sys.stderr)
              sys.exit(1)

          citations = int(stats[0].replace(',', ''))
          hindex = int(stats[2].replace(',', ''))

          if citations < previous.get('citations', 0):
              print(f"Parsed citations ({citations}) is lower than the "
                    f"previously stored value ({previous.get('citations', 0)}) "
                    "- looks like a bad scrape, refusing to overwrite.",
                    file=sys.stderr)
              sys.exit(1)

          data = {
              'citations': citations,
              'hindex':    hindex,
              'updated':   date.today().isoformat(),
          }

          with open('data/scholar.json', 'w') as fh:
              json.dump(data, fh, indent=2)
              fh.write('\n')

          print(f"citations={data['citations']}, hindex={data['hindex']}")

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git diff --cached --quiet || git commit -m "chore: update Scholar stats [skip ci]"
          git push
